        <span>SS Transport Quotation</span>
    </h1>
    <div class="version">V2R03</div>
    <div id="loadingMsg" class="loading">Loading rates from cloud...</div>
    <div id="errorMsg" class="error" style="display:none;"></div>

    <div class="form-group">
        <label for="vehicleType">🚛 Select Your Vehicle</label>
        <select id="vehicleType">
            <option value="10ft">10ft Lorry</option>
            <option value="14ft">14ft Lorry</option>
            <option value="17ft">17ft Lorry</option>
        </select>
    </div>

    <div class="form-group">
        <label for="distance">📍 Pickup – Drop Distance (km)</label>
        <input type="number" id="distance" placeholder="Enter distance in km" min="1" step="any">
    </div>

    <div class="form-group">
        <label for="pickupDateTime">📅 Date / Time to Pickup</label>
        <input type="datetime-local" id="pickupDateTime">
    </div>

    <div class="form-group">
        <label for="helpers">👷 Need How Many Helpers?</label>
        <input type="number" id="helpers" value="0" min="0" step="1">
        <small>RM<span id="helperRateDisplay">100</span> per helper</small>
    </div>

    <div class="form-group">
        <div class="checkbox-group">
            <input type="checkbox" id="tailgate">
            <label for="tailgate">🔧 Need Tailgate? (+RM<span id="tailgateRateDisplay">100</span>)</label>
        </div>
    </div>

    <div class="form-group">
        <label for="dropPoints">📍 How Many Drop Points?</label>
        <input type="number" id="dropPoints" value="1" min="1" step="1">
        <small>First drop included, extra drops RM<span id="extraDropRateDisplay">30</span> each</small>
    </div>

    <button class="btn-calculate" onclick="calculateFare()">💰 Calculate Total Price</button>
    <div class="total-box" id="totalDisplay">RM 0.00</div>
    <div class="waiting-warning">⚠️ A waiting fee will be charged for any delay exceeding 30 minutes.</div>
    <button class="btn-download" id="downloadBtn" style="display: none;" onclick="downloadSummary()">📥 Download Quotation (PDF)</button>

    <script>
        // ==================== CLOUD RATES URL ====================
        // ⬇️ REPLACE THIS URL WITH YOUR ACTUAL APPS SCRIPT WEB APP URL ⬇️
        const RATES_API_URL = "https://script.google.com/macros/s/AKfycbxH4EZreoepA7-x_KGIGq5KeeK9R9Bv2AW1AOGAJlml9lAXjLOeNQHQ9YMhLo9QhSJf/exec";

        let currentRates = null;
        let ratesLoaded = false;

        async function loadRates() {
            const loadingDiv = document.getElementById('loadingMsg');
            const errorDiv = document.getElementById('errorMsg');
            try {
                const response = await fetch(RATES_API_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                currentRates = await response.json();
                // Convert 9999 back to Infinity for extraTiers
                for (const veh in currentRates.vehicleRates) {
                    const tiers = currentRates.vehicleRates[veh].extraTiers;
                    for (let i = 0; i < tiers.length; i++) {
                        if (tiers[i].upTo === 9999) tiers[i].upTo = Infinity;
                    }
                }
                ratesLoaded = true;
                loadingDiv.style.display = 'none';
                updateRateDisplays();
                console.log('Rates loaded');
            } catch (err) {
                console.error(err);
                loadingDiv.style.display = 'none';
                errorDiv.style.display = 'block';
                errorDiv.innerText = '⚠️ Failed to load rates. Please refresh or contact support.';
                // Fallback rates (with 5 tiers)
                currentRates = {
                    vehicleRates: {
                        "10ft": { baseKm: 10, basePrice: 120, extraTiers: [{ upTo: 60, rate: 5 }, { upTo: 100, rate: 4.5 }, { upTo: 150, rate: 4 }, { upTo: 200, rate: 3.5 }, { upTo: Infinity, rate: 3 }] },
                        "14ft": { baseKm: 5, basePrice: 200, extraTiers: [{ upTo: 60, rate: 6 }, { upTo: 150, rate: 4.5 }, { upTo: 200, rate: 4 }, { upTo: 300, rate: 3.5 }, { upTo: Infinity, rate: 3 }] },
                        "17ft": { baseKm: 5, basePrice: 240, extraTiers: [{ upTo: 60, rate: 6 }, { upTo: 150, rate: 5 }, { upTo: 200, rate: 4.5 }, { upTo: 300, rate: 4 }, { upTo: Infinity, rate: 3.5 }] }
                    },
                    helperPrice: 100,
                    tailgatePrice: 100,
                    extraDropPrice: 30,
                    lateNightMultiplier: 1.6,
                    lateNightStartHour: 22,
                    lateNightEndHour: 7,
                    rushHourSurcharges: { "10ft": 20, "14ft": 30, "17ft": 30 },
                    rushMorningStart: { hour: 7, minute: 30 },
                    rushMorningEnd: { hour: 9, minute: 45 },
                    rushAfternoonStart: { hour: 16, minute: 30 },
                    rushAfternoonEnd: { hour: 19, minute: 0 }
                };
                ratesLoaded = true;
                updateRateDisplays();
            }
        }

        function updateRateDisplays() {
            if (!currentRates) return;
            document.getElementById('helperRateDisplay').innerText = currentRates.helperPrice;
            document.getElementById('tailgateRateDisplay').innerText = currentRates.tailgatePrice;
            document.getElementById('extraDropRateDisplay').innerText = currentRates.extraDropPrice;
        }

        function isRushHour(pickupDate) {
            if (!pickupDate || !currentRates) return false;
            const minutes = pickupDate.getHours() * 60 + pickupDate.getMinutes();
            const ms = currentRates.rushMorningStart.hour * 60 + currentRates.rushMorningStart.minute;
            const me = currentRates.rushMorningEnd.hour * 60 + currentRates.rushMorningEnd.minute;
            const as = currentRates.rushAfternoonStart.hour * 60 + currentRates.rushAfternoonStart.minute;
            const ae = currentRates.rushAfternoonEnd.hour * 60 + currentRates.rushAfternoonEnd.minute;
            return (minutes >= ms && minutes <= me) || (minutes >= as && minutes <= ae);
        }

        function getRushHourSurcharge(vehicle, pickupDate) {
            if (!isRushHour(pickupDate)) return 0;
            return currentRates.rushHourSurcharges[vehicle] || 0;
        }

        function isLateNight(pickupDate) {
            if (!pickupDate || !currentRates) return false;
            const hour = pickupDate.getHours();
            return hour >= currentRates.lateNightStartHour || hour < currentRates.lateNightEndHour;
        }

        function calculateDistanceFare(vehicle, distance) {
            const config = currentRates.vehicleRates[vehicle];
            if (!config) return 0;
            if (distance <= config.baseKm) return config.basePrice;
            const extra = distance - config.baseKm;
            let rate = 0;
            for (const tier of config.extraTiers) {
                if (distance <= tier.upTo) { rate = tier.rate; break; }
            }
            return config.basePrice + extra * rate;
        }

        let lastCalc = null;

        function calculateFare() {
            if (!currentRates) {
                alert('Rates not loaded yet. Please wait a moment.');
                return;
            }
            const vehicle = document.getElementById('vehicleType').value;
            const distance = parseFloat(document.getElementById('distance').value);
            const pickupStr = document.getElementById('pickupDateTime').value;
            const helpers = parseInt(document.getElementById('helpers').value) || 0;
            const tailgate = document.getElementById('tailgate').checked;
            const dropPoints = parseInt(document.getElementById('dropPoints').value) || 1;

            if (isNaN(distance) || distance <= 0) {
                alert('Please enter a valid distance.');
                lastCalc = null;
                document.getElementById('downloadBtn').style.display = 'none';
                return;
            }

            let fare = calculateDistanceFare(vehicle, distance);
            let lateNight = false, pickupDate = null;
            if (pickupStr) {
                pickupDate = new Date(pickupStr);
                if (!isNaN(pickupDate)) lateNight = isLateNight(pickupDate);
            }
            if (lateNight) fare *= currentRates.lateNightMultiplier;
            let rush = 0;
            if (pickupDate && !lateNight) rush = getRushHourSurcharge(vehicle, pickupDate);

            const helperCost = helpers * currentRates.helperPrice;
            const tailgateCost = tailgate ? currentRates.tailgatePrice : 0;
            const extraDropCost = Math.max(0, dropPoints - 1) * currentRates.extraDropPrice;
            const total = fare + helperCost + tailgateCost + extraDropCost + rush;
            document.getElementById('totalDisplay').innerHTML = `RM ${total.toFixed(2)}`;
            lastCalc = { vehicle, distance, pickupStr, helpers, tailgate, dropPoints, total };
            document.getElementById('downloadBtn').style.display = 'block';
        }

        function downloadSummary() {
            if (!lastCalc) { alert('Calculate fare first.'); return; }
            const d = lastCalc;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFillColor(0, 123, 255); doc.rect(0, 0, 210, 25, 'F');
            doc.setFont('helvetica', 'bold'); doc.setTextColor(255,255,255); doc.setFontSize(20);
            doc.text('Lorry Fare Quotation', 105, 16, { align: 'center' });
            doc.setTextColor(0,0,0); doc.setFontSize(13); doc.setFont('helvetica', 'normal');
            let y = 40;
            const addRow = (label, val) => {
                doc.setFont('helvetica', 'bold'); doc.text(label, 25, y);
                doc.setFont('helvetica', 'normal'); doc.text(val, 120, y);
                y += 11;
            };
            addRow('Vehicle:', d.vehicle + ' Lorry');
            addRow('Distance:', d.distance + ' km');
            addRow('Pickup Date/Time:', d.pickupStr ? new Date(d.pickupStr).toLocaleString() : 'Not specified');
            addRow('Helpers:', d.helpers.toString());
            addRow('Tailgate:', d.tailgate ? 'Yes' : 'No');
            addRow('Drop Points:', d.dropPoints.toString());
            y += 8;
            doc.setFillColor(240,240,240); doc.rect(20, y-6, 160, 14, 'F');
            doc.setFont('helvetica', 'bold'); doc.setFontSize(15);
            doc.text('TOTAL:', 25, y);
            doc.text(`RM ${d.total.toFixed(2)}`, 120, y);
            doc.setFontSize(9); doc.setFont('helvetica', 'italic'); doc.setTextColor(100,100,100);
            doc.text('Waiting fee charged for delays exceeding 30 minutes.', 105, 280, { align: 'center' });
            doc.save('quotation_summary.pdf');
        }

        // Start loading rates
        loadRates();
    </script>
</body>
